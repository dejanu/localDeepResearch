[project]
name = "localdeepresearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alexandrudejanu", email = "alexandru.dejanu@alchemy.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.9.0",
    "click>=8.5.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
localdeepresearch = "localdeepresearch:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
